name = "fleet-in-pieces-site"
pages_build_output_dir = "./site"
compatibility_date = "2026-05-22"

# Bound each invocation; these are not an account-wide spending cap.
# The site previously operated within the Free plan's 50-subrequest limit.
# Pages confirms cpu_ms; its API does not confirm subrequests. The application
# also enforces 50 D1 statements/request independently in database(env).
[limits]
cpu_ms = 100
subrequests = 50

[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "fleet-in-pieces-community"
database_id = "a27dbf92-3ecb-4b41-9428-2d76ba7a558e"
migrations_dir = "migrations"

# Preview deployments deliberately have no access to public community data.
# Wrangler's local development database is isolated from production automatically.
[env.preview]
d1_databases = []
